<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gabay{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --g-ink: #1f2a37; --g-muted: #5b6673; --g-paper: #f4f6f3; --g-line: #d9dfd9;
      --g-brand: #0f766e; --g-brand-dark: #0b5f59; --g-absent: #be123c; --g-late: #b45309;
      --g-warn-bg: #fff4d6; --g-warn-line: #e3b341;
      --bs-body-font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
      --bs-body-color: var(--g-ink);
      --bs-link-color-rgb: 15, 118, 110; --bs-link-hover-color-rgb: 11, 95, 89;
    }
    body { background: var(--g-paper); }
    .btn-primary { --bs-btn-bg: var(--g-brand); --bs-btn-border-color: var(--g-brand);
      --bs-btn-hover-bg: var(--g-brand-dark); --bs-btn-hover-border-color: var(--g-brand-dark);
      --bs-btn-active-bg: var(--g-brand-dark); --bs-btn-active-border-color: var(--g-brand-dark); }
    :focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
    .gabay-nav { background: #fff; border-bottom: 1px solid var(--g-line); }
    .brand { font-weight: 700; font-size: 1.35rem; color: var(--g-brand); text-decoration: none; }
    .panel { background: #fff; border: 1px solid var(--g-line); border-radius: 10px; padding: 1.1rem 1.25rem; }
    .panel h2 { font-size: 1.1rem; margin-bottom: .75rem; }
    .notice { background: var(--g-warn-bg); border: 1px solid var(--g-warn-line); border-left-width: 6px; border-radius: 10px; padding: 1rem 1.25rem; }
    .stat-value { font-size: 2rem; font-weight: 700; line-height: 1.1; }
    .stat-label { color: var(--g-muted); font-size: .9rem; }
    .text-absent { color: var(--g-absent); font-weight: 700; }
    .text-late { color: var(--g-late); font-weight: 700; }
    .table > :not(caption) > * > * { padding: .6rem .5rem; }
  </style>
</head>
<body>
  <header class="gabay-nav">
    <div class="container-xl d-flex align-items-center gap-3 py-2">
      <a class="brand" href="{% url 'auth:home' %}">Gabay</a>
      {% if user.is_authenticated %}
        <span class="ms-auto small text-muted">{{ user.get_full_name|default:user.username }}, {{ user.get_role_display }}</span>
        <form method="post" action="{% url 'auth:logout' %}" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
        </form>
      {% endif %}
    </div>
  </header>
  <main class="container-xl py-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
